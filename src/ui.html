<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Apuntes</title>
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Apuntes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@400;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3eee3; --sheet: #fbf8f1; --ink: #1d1b16; --ink-2: #4a463c; --faint: #8b8473;
  --rule: #ddd5c3; --rule-soft: #e9e2d2; --stamp: #d2452b; --stamp-ink: #fff;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t-red: #e9b2a3; --t-orange: #eec08f; --t-yellow: #ecd98a; --t-green: #b9cf9c; --t-teal: #9fc9bd;
  --t-blue: #a9c0d6; --t-purple: #c4b2d4; --t-pink: #e8bcc6; --t-brown: #cdb79b; --t-gray: #c5c1b6;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #16140f; --sheet: #1e1b15; --ink: #ede6d6; --ink-2: #c3bba8; --faint: #8a8270;
    --rule: #37322a; --rule-soft: #2a2620; --stamp: #ef6a4f; --stamp-ink: #16140f;
    --t-red: #9a4a3a; --t-orange: #9a6a36; --t-yellow: #8e7a2c; --t-green: #5c7240; --t-teal: #3f6e64;
    --t-blue: #48627c; --t-purple: #65517a; --t-pink: #8a4f5d; --t-brown: #75614a; --t-gray: #5a564d;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--desk, var(--paper)); color: var(--ink); }
body { font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; background: transparent; border: 0; outline: none; padding: 0; min-width: 0; }
::placeholder { color: var(--faint); opacity: 1; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; border-radius: 4px; }

/* ---------- estructura ---------- */
.shell { display: grid; min-height: 100dvh; }
.pane { display: flex; flex-direction: column; min-height: 100dvh; min-width: 0; }
.pane-body { flex: 1; padding: calc(var(--safe-t) + 20px) 20px 24px; }
body[data-view="home"] #listPane, body[data-view="list"] #homePane { display: none; }
@media (min-width: 880px) {
  .shell { grid-template-columns: minmax(300px, 380px) 1fr; height: 100dvh; }
  .pane { height: 100dvh; min-height: 0; overflow-y: auto; }
  #homePane { border-right: 1px solid var(--rule); }
  body[data-view] #listPane, body[data-view] #homePane { display: flex; }
  #listPane .pane-body, #listPane .composer-inner { max-width: 680px; width: 100%; margin-inline: auto; }
  .back { display: none !important; }
}

/* ---------- portada ---------- */
.dateline { font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  display: flex; justify-content: space-between; align-items: center; }
.dateline button { letter-spacing: inherit; text-transform: inherit; padding: 6px 0 6px 12px; }
h1.mast { font: 400 56px/0.95 var(--serif); letter-spacing: -.01em; margin: 14px 0 6px; }
h1.mast em { color: var(--stamp); }
.tally { font: 13px/1.3 var(--mono); color: var(--faint); margin-bottom: 22px; }
.find { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--rule); padding: 8px 0; margin-bottom: 8px; }
.find svg { flex: none; color: var(--faint); }
.label { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 26px 0 6px; }
.row { display: grid; grid-template-columns: 5px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left;
  padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
.row .tab { align-self: stretch; border-radius: 3px; background: var(--rule); }
.row .name { font: 400 25px/1.1 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .peek { font-size: 13px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.row .count { font: 12px/1 var(--mono); color: var(--faint); text-align: right; }
.ticks { display: flex; gap: 2px; justify-content: flex-end; margin-top: 6px; }
.ticks i { width: 5px; height: 9px; border: 1px solid var(--faint); border-radius: 1px; }
.ticks i.on { background: var(--ink); border-color: var(--ink); }
.row[aria-current="true"] .name { color: var(--stamp); }
.row:active { opacity: .6; }
.empty { color: var(--faint); font: italic 22px/1.3 var(--serif); padding: 40px 0; text-align: center; }

/* ---------- lista abierta ---------- */
.listhead { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.iconbtn:active { background: var(--rule-soft); }
.back { margin-left: -12px; }
.band { height: 6px; border-radius: 3px; background: var(--rule); margin: 8px 0 18px; width: 64px; }
.ltitle { font: 400 44px/1.02 var(--serif); width: 100%; letter-spacing: -.01em; }
.lmeta { font: 12px/1 var(--mono); color: var(--faint); margin: 10px 0 18px; letter-spacing: .04em; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--rule-soft); }
.item input { flex: 1; font-size: 17px; padding: 12px 0; }
.box { flex: none; width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; }
.box span { width: 22px; height: 22px; border: 1.6px solid var(--ink-2); border-radius: 5px; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { opacity: 0; }
.box path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .25s ease-out .05s; }
.item.done .box span { background: var(--stamp); border-color: var(--stamp); }
.item.done .box svg { opacity: 1; }
.item.done .box path { stroke-dashoffset: 0; }
.item.done input { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--stamp); text-decoration-thickness: 1.5px; }
.x { flex: none; width: 40px; height: 40px; display: none; place-items: center; color: var(--faint); }
.item:focus-within .x { display: grid; }
@media (hover: hover) { .item:hover .x { display: grid; } }
.donebar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 22px 0 6px;
  font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.donebar .chev { transition: transform .2s; display: inline-block; }
.donebar[aria-expanded="true"] .chev { transform: rotate(90deg); }
.nolist { color: var(--faint); font: italic 26px/1.3 var(--serif); margin-top: 30vh; text-align: center; }

/* ---------- barra de escritura inferior ---------- */
.composer { position: sticky; bottom: 0; background: linear-gradient(to bottom, transparent, var(--desk, var(--paper)) 16px);
  padding: 16px 16px calc(12px + var(--safe-b)); z-index: 3; }
.composer-inner { display: flex; align-items: center; gap: 8px; background: var(--sheet); border: 1px solid var(--rule);
  border-radius: 14px; padding: 6px 6px 6px 16px; box-shadow: 0 6px 20px -12px rgba(40, 30, 10, .35); }
.composer input { flex: 1; font-size: 17px; padding: 10px 0; }
.send { width: 40px; height: 40px; border-radius: 10px; background: var(--ink); color: var(--paper); display: grid; place-items: center; flex: none; }
.send:disabled { background: var(--rule); color: var(--faint); }

/* ---------- hoja de opciones ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 16, 8, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 20px 20px 0 0; z-index: 11;
  padding: 10px 20px calc(20px + var(--safe-b)); transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  max-width: 520px; margin: 0 auto; border: 1px solid var(--rule); border-bottom: 0; }
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; }
.grip { width: 36px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 16px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--rule-soft); }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule); position: relative; }
.sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border: 1.6px solid var(--ink); border-radius: 50%; }
.sw.none { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--rule) 5px 6px); }
.act { display: flex; width: 100%; padding: 15px 0; border-bottom: 1px solid var(--rule-soft); font-size: 17px; text-align: left; }
.act:last-child { border-bottom: 0; }
.act.warn { color: var(--stamp); }

/* ---------- acceso ---------- */
.gate { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 440px; margin: 0 auto; }
.gate h1 { font: 400 64px/0.95 var(--serif); margin: 0 0 12px; }
.gate h1 em { color: var(--stamp); }
.gate p { color: var(--ink-2); margin: 0 0 28px; }
.gate .composer-inner { box-shadow: none; }
.gate .err { font: 13px var(--mono); color: var(--stamp); min-height: 20px; margin-top: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--paper); font: 13px var(--mono); padding: 10px 14px; border-radius: 10px; transition: .2s; z-index: 20; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
[data-c="red"] { --tint: var(--t-red); } [data-c="orange"] { --tint: var(--t-orange); } [data-c="yellow"] { --tint: var(--t-yellow); }
[data-c="green"] { --tint: var(--t-green); } [data-c="teal"] { --tint: var(--t-teal); } [data-c="blue"] { --tint: var(--t-blue); }
[data-c="purple"] { --tint: var(--t-purple); } [data-c="pink"] { --tint: var(--t-pink); } [data-c="brown"] { --tint: var(--t-brown); }
[data-c="gray"] { --tint: var(--t-gray); }
.row[data-c] .tab, .band[data-c], .sw[data-c] { background: var(--tint, var(--rule)); }

/* ---------- elementos que solo usan algunas estéticas ---------- */
.mini, .rfoot, .stamp, .leader { display: none; }
.dl-actions { display: flex; gap: 4px; }

/* =========================================================
   ESTÉTICA «TICKET»: cada pantalla es un ticket de caja
   ========================================================= */
body[data-skin="ticket"] {
  --desk: #cfcdc6; --paper: #fbfbf7; --sheet: #fbfbf7; --ink: #232323; --ink-2: #3a3a3a; --faint: #7a7a74;
  --rule: #bdbab2; --rule-soft: #e4e2db; --stamp: #2a4fa0; --stamp-ink: #fbfbf7;
  --serif: "IBM Plex Mono", ui-monospace, monospace; --sans: "IBM Plex Mono", ui-monospace, monospace; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { body[data-skin="ticket"] { --desk: #262522; } }
body[data-skin="ticket"] { font-size: 14px; }
body[data-skin="ticket"] .pane-body { padding: calc(var(--safe-t) + 14px) 12px 8px; }
body[data-skin="ticket"] .paper { position: relative; background: var(--paper); color: var(--ink); padding: 18px 16px 34px;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%; }
body[data-skin="ticket"] .dateline { font-size: 11px; letter-spacing: .06em; }
body[data-skin="ticket"] h1.mast { font: 600 22px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; margin: 18px 0 6px; }
body[data-skin="ticket"] h1.mast em { color: inherit; font-style: normal; }
body[data-skin="ticket"] .tally { text-align: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--ink); }
body[data-skin="ticket"] .find { border-bottom: 1px dashed var(--rule); }
body[data-skin="ticket"] .label { margin: 16px 0 4px; letter-spacing: .1em; }
body[data-skin="ticket"] .row { grid-template-columns: 1fr auto; gap: 8px; padding: 7px 0; border: 0; align-items: start; }
body[data-skin="ticket"] .row .tab, body[data-skin="ticket"] .ticks { display: none; }
body[data-skin="ticket"] .row .name { font: 400 14px/1.3 var(--mono); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: clip; }
body[data-skin="ticket"] .row .name::after { content: " ........................................................"; color: var(--faint); }
body[data-skin="ticket"] .row .peek { font-size: 11px; white-space: normal; }
body[data-skin="ticket"] .row .count { font-size: 14px; color: var(--ink); }
body[data-skin="ticket"] .row[aria-current="true"] .name { color: var(--ink); font-weight: 600; }
body[data-skin="ticket"] .rfoot { display: block; border-top: 1px dashed var(--ink); margin-top: 14px; padding-top: 10px; }
body[data-skin="ticket"] .rfoot .tot { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
body[data-skin="ticket"] .rfoot .tot.sm { font-weight: 400; font-size: 13px; }
body[data-skin="ticket"] .rfoot .bar { height: 38px; margin: 16px 12% 6px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 3px, var(--ink) 3px 4px, transparent 4px 7px, var(--ink) 7px 10px, transparent 10px 11px); }
body[data-skin="ticket"] .rfoot .thx { text-align: center; font-size: 11px; letter-spacing: .1em; }
body[data-skin="ticket"] .listhead .iconbtn { color: var(--ink); }
body[data-skin="ticket"] .band { display: none; }
body[data-skin="ticket"] .ltitle { font: 600 24px/1.1 var(--mono); letter-spacing: .14em; text-transform: uppercase; text-align: center; }
body[data-skin="ticket"] .lmeta { text-align: center; text-transform: uppercase; padding-bottom: 12px; border-bottom: 1px dashed var(--ink); }
body[data-skin="ticket"] .item { min-height: 40px; border: 0; gap: 4px; }
body[data-skin="ticket"] .item input { font-size: 15px; text-transform: uppercase; padding: 8px 0; }
body[data-skin="ticket"] .box { width: 40px; margin-left: -6px; }
body[data-skin="ticket"] .box span, body[data-skin="ticket"] .item.done .box span { border: 0; background: none; width: auto; height: auto; font: 15px var(--mono); color: var(--ink); }
body[data-skin="ticket"] .box span::before { content: "[ ]"; white-space: pre; }
body[data-skin="ticket"] .item.done .box span::before { content: "[x]"; }
body[data-skin="ticket"] .box svg { display: none; }
body[data-skin="ticket"] .item.done input { text-decoration-color: var(--ink); }
body[data-skin="ticket"] .donebar { border-top: 1px dashed var(--rule); margin-top: 8px; }
body[data-skin="ticket"] .stamp { display: block; position: absolute; right: 18px; top: 74px; transform: rotate(-10deg); border: 2px solid var(--stamp);
  color: var(--stamp); font: 600 15px var(--mono); letter-spacing: .14em; padding: 2px 8px; border-radius: 3px; opacity: .85; pointer-events: none; }
body[data-skin="ticket"] .composer-inner { background: #232323; border-color: #232323; border-radius: 6px; color: #e9e7df; box-shadow: none; padding-left: 12px; }
body[data-skin="ticket"] .composer-inner::before { content: ">"; color: #e9e7df; }
body[data-skin="ticket"] .composer input { color: #e9e7df; font-size: 15px; }
body[data-skin="ticket"] .composer input::placeholder { color: #9b9890; }
body[data-skin="ticket"] .send, body[data-skin="ticket"] .send:disabled { background: transparent; color: #e9e7df; }
body[data-skin="ticket"] .send:disabled { opacity: .4; }
body[data-skin="ticket"] .sheet { border-radius: 4px 4px 0 0; }
body[data-skin="ticket"] .nolist, body[data-skin="ticket"] .empty { font: 14px var(--mono); }

/* =========================================================
   ESTÉTICA «NEVERA»: notas adhesivas en la puerta
   ========================================================= */
body[data-skin="nevera"] {
  --desk: #dfe6ea; --paper: #dfe6ea; --sheet: #fbfbf6; --ink: #2f3c45; --ink-2: #44525c; --faint: #6c7a84;
  --rule: #c3ccd2; --rule-soft: #d2dade; --stamp: #2f3c45; --stamp-ink: #fff27a;
  --serif: "Kalam", "Comic Sans MS", cursive; --sans: "Nunito", ui-rounded, system-ui, sans-serif; --mono: "Nunito", ui-rounded, system-ui, sans-serif;
  --note-ink: #2a2a2a;
}
@media (prefers-color-scheme: dark) {
  body[data-skin="nevera"] { --desk: #1c2328; --paper: #1c2328; --sheet: #263038; --ink: #e3e9ed; --ink-2: #c4ced5; --faint: #8e9ba4; --rule: #34404a; --rule-soft: #2b353d; }
}
body[data-skin="nevera"] [data-c] { --note: #fbfbf6; }
body[data-skin="nevera"] [data-c="yellow"] { --note: #fff27a; } body[data-skin="nevera"] [data-c="red"] { --note: #ffb4a2; }
body[data-skin="nevera"] [data-c="orange"] { --note: #ffcf8a; } body[data-skin="nevera"] [data-c="green"] { --note: #c8f1a6; }
body[data-skin="nevera"] [data-c="teal"] { --note: #b5ead7; } body[data-skin="nevera"] [data-c="blue"] { --note: #a8dcff; }
body[data-skin="nevera"] [data-c="purple"] { --note: #d9c4f5; } body[data-skin="nevera"] [data-c="pink"] { --note: #ffc2d1; }
body[data-skin="nevera"] [data-c="brown"] { --note: #e6d3b3; } body[data-skin="nevera"] [data-c="gray"] { --note: #e4e4e0; }
body[data-skin="nevera"] .dateline { font: 700 12px var(--sans); letter-spacing: .04em; text-transform: none; }
body[data-skin="nevera"] h1.mast { font: 800 34px/1 var(--sans); margin: 14px 0 4px; }
body[data-skin="nevera"] h1.mast em { color: inherit; font-style: normal; }
body[data-skin="nevera"] .tally { font: 600 13px var(--sans); }
body[data-skin="nevera"] .find { background: var(--sheet); border: 0; border-radius: 999px; padding: 10px 16px; margin-bottom: 4px; }
body[data-skin="nevera"] #index { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; padding-top: 6px; }
body[data-skin="nevera"] .label, body[data-skin="nevera"] .empty, body[data-skin="nevera"] #index > .peek { grid-column: 1 / -1; }
body[data-skin="nevera"] .label { font: 800 12px var(--sans); letter-spacing: .06em; margin: 14px 0 0; }
body[data-skin="nevera"] .row { display: block; position: relative; background: var(--note, #fbfbf6); color: var(--note-ink); border: 0; padding: 18px 12px 12px; min-height: 120px;
  box-shadow: 0 8px 12px -8px rgba(0,0,0,.4); transform: rotate(var(--rot, -1deg)); transition: transform .15s; }
body[data-skin="nevera"] .row:nth-of-type(3n+1) { --rot: -1.4deg; } body[data-skin="nevera"] .row:nth-of-type(3n+2) { --rot: 1.2deg; } body[data-skin="nevera"] .row:nth-of-type(3n) { --rot: -.5deg; }
body[data-skin="nevera"] .row::before { content: ""; position: absolute; top: -8px; left: 50%; width: 48px; height: 15px; transform: translateX(-50%) rotate(-3deg);
  background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
body[data-skin="nevera"] .row:active { transform: rotate(0) scale(.97); opacity: 1; }
body[data-skin="nevera"] .row .tab, body[data-skin="nevera"] .row .peek, body[data-skin="nevera"] .ticks { display: none; }
body[data-skin="nevera"] .row .name { font: 700 19px/1.1 var(--serif); white-space: normal; margin-bottom: 4px; }
body[data-skin="nevera"] .row[aria-current="true"] .name { color: var(--note-ink); text-decoration: underline wavy rgba(0,0,0,.35); }
body[data-skin="nevera"] .row .count { position: absolute; right: 10px; bottom: 8px; font: 700 11px var(--sans); color: rgba(0,0,0,.45); }
body[data-skin="nevera"] .mini { display: block; font: 14px/1.25 var(--serif); }
body[data-skin="nevera"] .mini .d { text-decoration: line-through; opacity: .5; }
body[data-skin="nevera"] .mini .more { font: 700 11px var(--sans); opacity: .5; margin-top: 2px; }
body[data-skin="nevera"] .band { display: none; }
body[data-skin="nevera"] #listBody .paper { position: relative; background: var(--note, #fbfbf6); color: var(--note-ink); padding: 24px 18px 18px; margin-top: 10px;

    try { await api('PATCH', '/lists/' + l.id, body); if (msg) toast(msg); if ('archived' in body) load(); } catch (e) { load(); }
  };
  const done = l.items.filter((i) => i.checked).length;
  const del = h('button', { class: 'act warn', onclick: async () => {
    if (!S.confirmDelete) { S.confirmDelete = true; del.textContent = 'Toca otra vez para borrar “' + l.title + '”'; return; }
    closeSheet(); S.lists = S.lists.filter((x) => x !== l); go(null);
    try { await api('DELETE', '/lists/' + l.id); toast('Lista borrada'); } catch (e) { load(); }
  } }, 'Borrar lista');
  $('sheet').replaceChildren(
    h('div', { class: 'grip' }),
    h('div', { class: 'label', style: 'margin-top:0;margin-bottom:12px' }, 'Color'),
    h('div', { class: 'swatches' }, COLORS.map((c) => h('button', {
      class: 'sw' + (c === 'default' ? ' none' : ''), 'data-c': c === 'default' ? null : c, title: COLOR_NAMES[c], 'aria-label': COLOR_NAMES[c],
      'aria-pressed': String(l.color === c), onclick: () => patch({ color: c }) }))),
    h('button', { class: 'act', onclick: () => patch({ pinned: !l.pinned }) }, l.pinned ? 'Quitar de fijadas' : 'Fijar arriba'),
    done ? h('button', { class: 'act', onclick: async () => {
      closeSheet(); l.items = l.items.filter((i) => !i.checked); renderList(); renderIndex();
      try { await api('POST', '/lists/' + l.id + '/clear-checked'); toast(done + (done === 1 ? ' hecho quitado' : ' hechos quitados')); } catch (e) { load(); }
    } }, 'Quitar los hechos (' + done + ')') : null,
    h('button', { class: 'act', onclick: () => { patch({ archived: !l.archived }, l.archived ? 'Recuperada del archivo' : 'Archivada'); if (!l.archived) go(null); } },
      l.archived ? 'Sacar del archivo' : 'Archivar'),
    del);
  document.body.classList.add('sheet-open');
}
function closeSheet() { document.body.classList.remove('sheet-open'); }

/* ---------- sincronización con lo que haga Claude ---------- */
function idle() {
  const a = document.activeElement;
  return !document.hidden && !document.body.classList.contains('sheet-open') && !(a && a.tagName === 'INPUT' && a.value);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) load(); });
setInterval(() => { if (token && idle() && !(document.activeElement && document.activeElement.tagName === 'INPUT')) load(); }, 15000);
load();
</script>
