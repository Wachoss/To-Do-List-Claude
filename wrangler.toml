name = "listas-ia"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "listas-ia"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.svg", "**/*.webmanifest"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false
